image spl.img {
	size = ${BOOT_SPL_SIZE}

	hdimage {
		partition-table-type = "none"
		fill = "yes"
	}

	# Offset Allwinner sun60iw2 (gli stessi di Armbian write_uboot_platform):
	#   boot0_sdcard.fex  -> 8 KiB      (dd bs=1k seek=8)
	#   boot_package.fex  -> 16400 KiB  (dd bs=1k seek=16400)
	partition boot0 {
		offset = 8k
		image = "boot0_sdcard.fex"
	}

	partition boot_package {
		offset = 16400k
		image = "boot_package.fex"
	}
}
